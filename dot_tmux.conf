# Terminal multiplexer
# https://github.com/tmux/tmux

# --- Général ---
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB,*:title"
set -g escape-time 0
set -g history-limit 1000000
set -g status-interval 15
set -g detach-on-destroy off
set -g set-clipboard on
set -g focus-events on
set -g set-titles on
set -g set-titles-string '#T'
set -g automatic-rename on
set -g base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# --- Prefix & Shortcuts ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind-key v copy-mode
bind r source-file ~/.tmux.conf \; display "reloaded"
bind g new-window -n lazygit lazygit

# --- Copy-mode (vi) ---
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# --- Sessions ---
bind -n M-, switch-client -p
bind -n M-S-s choose-tree -Zs
bind -n M-g command-prompt -I "#S" -p "session:" "switch-client -t '%%'"

# --- Windows ---
bind -n M-n new-window -c "#{pane_current_path}"
bind -n M-j swap-window -d -t +1
bind -n M-k swap-window -d -t -1
bind -n M-h previous-window
bind -n M-l next-window
bind -n "M- " last-window
bind -n M-w choose-tree -Zw

# --- Panes ---
unbind '"'
unbind %
bind = split-window -v
bind '"' split-window -h
bind -r m resize-pane -Z
bind x kill-pane

# --- Status bar ---
set -g status-style bg=default
set -g status-position top
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"

# --- Plugins ---

# --- TPM (Tmux Plugin Manager) ---
set -g @plugin 'tmux-plugins/tpm'

# catppuccin
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W #T'
set -g @catppuccin_window_current_text ' #W #T'

# Plugin list
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-command 'tmux set-buffer -- "{}" && printf "%s" "{}" | /usr/bin/iconv -f UTF-8 -t UTF-16LE | /mnt/c/WINDOWS/system32/clip.exe'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_pattern '(\S+/)?g?\.?(view|l?n?vim?x?|fzf|tv)(diff)?(-wrapped)?'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'joshmedeski/tmux-fzf-url'

# fzf-url
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# sesh
bind-key -n M-o display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Sesh' tv sesh

# resurrect & continuum
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Plugin initialization (must be at the end)
run ~/.tmux/plugins/catppuccin/catppuccin.tmux
run-shell ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux
run '~/.tmux/plugins/tpm/tpm'

# Idk which plugin overrides this but it needs to be here...
set -g status-style bg=default
