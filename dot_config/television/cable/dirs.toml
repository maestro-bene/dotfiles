[metadata]
name = "dirs"
description = "A channel to select from directories"
requirements = ["fd", "lsd"]

[source]
command = ["fd --absolute-path -t d", "fd --absolute-path -t d --hidden"]

[preview]
command = "lsd --color always --icon never -la '{}'"

[keybindings]
shortcut = "f2"
enter = "actions:cd"

[actions.cd]
description = "Open the selected directory in a new Rex tab"
command = "rex do rex_new_tab_at path='{}'"
mode = "execute"

[actions.goto_parent_dir]
description = "Re-opens tv in the parent directory"
command = "tv dirs .."
mode = "execute"
