[metadata]
name = "zoxide"
description = "Browse zoxide directory history"
requirements = ["zoxide", "lsd"]

[source]
command = "zoxide query -l"
no_sort = true
frecency = false

[preview]
command = "lsd --color always --icon never -la '{}'"

[keybindings]
enter = "actions:cd"
ctrl-d = "actions:remove"

[actions.cd]
description = "Open the selected directory in a new Rex tab"
command = "rex do rex_new_tab_at path='{}'"
mode = "execute"

[actions.remove]
description = "Remove the selected directory from zoxide"
command = "zoxide remove '{}'"
mode = "fork"
