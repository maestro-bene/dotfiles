[metadata]
name = "path"
description = "Investigate PATH contents"
requirements = ["fd", "bat"]

[source]
command = "printf '%s\n' \"$PATH\" | tr ':' '\n'"

[preview]
command = "fd -tx -d1 . \"{}\" -X printf \"%s\n\" \"{/}\" | sort -f | bat -n --color=always"

[actions.cd]
description = "Open the selected PATH directory in a new Rex tab"
command = "rex do rex_new_tab_at path='{}'"
mode = "execute"
