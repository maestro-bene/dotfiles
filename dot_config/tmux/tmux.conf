# Terminal multiplexer
# https://github.com/tmux/tmux

# Preserve the legacy Homebrew tmux plugins location while moving configuration
# into XDG_CONFIG_HOME.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# --- General ---
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB,*:title"
set -g escape-time 0
set -g history-limit 1000000
set -g status-interval 15
set -g detach-on-destroy off
set -g set-clipboard on
set -g focus-events on
set -g set-titles on
set -g set-titles-string '#T'
set -g automatic-rename on
set -g base-index 1
set -g extended-keys on
set -g extended-keys-format csi-u
set -g renumber-windows on
setw -g mode-keys vi

# --- Prefix & Shortcuts ---
unbind C-b
set -g prefix C-q
bind C-q send-prefix
bind-key v copy-mode
bind R source-file ~/.config/tmux/tmux.conf \; display "reloaded"
if-shell 'command -v workmux >/dev/null 2>&1' 'bind i display-popup -E -w 90% -h 90% -d "#{pane_current_path}" -T "Workmux dashboard" workmux dashboard'
if-shell 'command -v lazygit >/dev/null 2>&1' 'bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" -T "lazygit" lazygit'

# --- Copy-mode (vi) ---
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# --- Sessions ---
# Sesh's own picker combines existing tmux sessions and zoxide directories.
if-shell 'command -v sesh >/dev/null 2>&1' 'bind -n M-Space display-popup -E -w 80% -h 70% -d "#{pane_current_path}" -T "Sessions" sesh picker --tmux --zoxide'

# --- Windows ---
bind n new-window -c "#{pane_current_path}"
bind -n M-j swap-window -d -t +1
bind -n M-k swap-window -d -t -1
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-o last-window

# --- Panes ---
unbind '"'
unbind %
bind e split-window -v
bind r split-window -h
bind -r m resize-pane -Z
bind x kill-pane

# --- Status bar ---
set -g status-style bg=default
set -g status-position top
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
# --- Plugins ---

# --- Tpack (TPM-compatible plugin manager) ---

# catppuccin
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W #T'
set -g @catppuccin_window_current_text ' #W #T'

# Plugin list (Tpack)
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @plugin 'fcsonline/tmux-thumbs'
# Keep selections in tmux's buffer on every platform.
set -g @thumbs-command 'tmux set-buffer -- "{}" && tmux show-buffer'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_pattern '(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf|tv)(diff)?(-wrapped)?'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'joshmedeski/tmux-fzf-url'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run 'tpack init'

# Idk which plugin overrides this but it needs to be here...
set -g status-style bg=default
